name: CI

# Actions are pinned to commit hashes: a moved tag can't change what runs here.
permissions:
  contents: read

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

jobs:
  test:
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Isolate test profile
        shell: bash
        run: printf '%s\n' "ZASLON_DIR=$RUNNER_TEMP/zaslon-ci-profile" >> "$GITHUB_ENV"
      - name: Vet
        run: go vet ./...
      - name: Panel permissions and status
        run: node --test scripts/test-panel-permissions.cjs scripts/test-panel-status.cjs
      # Includes TestRealProcess: freezes, resumes and closes a real process on each OS.
      - name: Test
        run: go test -count=1 -timeout=120s ./...
      - name: Windows CLI recognition, suspension and resume
        if: runner.os == 'Windows'
        run: go test -tags=zaslon_cli_e2e -count=1 -timeout=120s -run '^TestWindowsCLIRecognitionAndDescendants$' ./internal/procs
      - name: Race
        if: runner.os != 'Windows'
        run: go test -race -count=1 -timeout=120s ./internal/...
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then ./scripts/build-mac.sh
          elif [ "$RUNNER_OS" = "Windows" ]; then
            bash ./scripts/build-windows.sh
            mkdir -p build/dev
            cp build/package/windows-amd64/zaslon.exe build/package/windows-amd64/zaslon-recover.exe build/dev/
          else bash ./scripts/build-linux.sh; fi
      - name: Verify complete archives and native version commands
        shell: bash
        run: |
          shopt -s nullglob
          archives=(dist/zaslon-*.zip dist/zaslon-*.tar.gz)
          [ "${#archives[@]}" -gt 0 ]
          for archive in "${archives[@]}"; do
            go run ./tools/package -verify "$archive" -smoke
          done
      - name: Unix installer (isolated HOME, no application startup)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/Test-UnixInstaller.sh
      - name: Unix pipe bootstrap (mocked downloads)
        if: runner.os != 'Windows'
        shell: bash
        run: bash ./scripts/Test-Bootstrap.sh
      - name: Windows pipe bootstrap (PowerShell 5.1 and 7, isolated directories)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $package = "dist/zaslon-$version-windows-amd64.zip"
          ./scripts/Test-Bootstrap.ps1 -WindowsPackage $package
          pwsh -NoProfile -File ./scripts/Test-Bootstrap.ps1 -WindowsPackage $package
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 bootstrap tests failed.' }
      - name: Installer offline transactions (isolated Windows directories)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          ./scripts/Test-Installer.ps1 -WindowsPackage "dist/zaslon-$version-windows-amd64.zip"
      - name: Panel lifecycle and identity (isolated Windows profiles)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ZASLON_TEST_PANEL_EXE = (Resolve-Path build/dev/zaslon.exe).Path
          go test -count=1 -timeout=90s -run 'TestReadyPanelIdentityEXE|TestReadyPanelEXE' ./internal/window ./internal/ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Domain checks end-to-end (isolated Windows fixtures)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -trimpath -ldflags '-H windowsgui' -o build/dev/domain-e2e.exe ./tools/domain-e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content VERSION -Raw).Trim()
          $package = (Resolve-Path "dist/zaslon-$version-windows-amd64.zip").Path
          $test = Start-Process -FilePath (Resolve-Path build/dev/domain-e2e.exe).Path -ArgumentList @('-installer-package', ('"' + $package + '"')) -Wait -PassThru -WindowStyle Hidden
          if ($test.ExitCode -ne 0) { throw "Domain checks E2E failed: $($test.ExitCode)" }
          $run = Get-ChildItem build/audit -Directory -Filter 'domain-e2e-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $report = Get-Content (Join-Path $run.FullName 'result.json') -Raw | ConvertFrom-Json
          if (-not $report.passed -or -not $report.cleanup_verified) { throw 'Domain checks E2E or cleanup failed.' }
          $report.checks
      - name: Upload checked release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ runner.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/zaslon-*.zip
            dist/zaslon-*.tar.gz
            dist/zaslon-*.sha256
