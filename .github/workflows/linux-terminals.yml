name: Linux interactive terminal diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [cgroup, bash]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Build guard and test Go packages
        run: |
          go build -o "$RUNNER_TEMP/zaslon" ./cmd/zaslon
          go test ./...
      - name: Prepare real console apps
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 2 -o codex.tar.gz https://github.com/openai/codex/releases/download/rust-v0.170.0/codex-package-x86_64-unknown-linux-musl.tar.gz
          echo 'a77ff87be7ba809d715728270a78f5ce3527dc07529416d1ef8929b90b8475eb  codex.tar.gz' | sha256sum -c
          mkdir package
          tar xzf codex.tar.gz -C package
          binary=$(find "$RUNNER_TEMP/package" -name codex -type f -perm /111 -print -quit)
          "$binary" --version
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/cli" @anthropic-ai/claude-code@2.1.328
          "$RUNNER_TEMP/cli/node_modules/.bin/claude" --version
          echo "CODEX_TEST_BIN=$binary" >> "$GITHUB_ENV"
      - name: Verify real guard plus keyboard and descendants
        env:
          MODE: ${{ matrix.mode }}
        run: |
          args=(/usr/bin/timeout 170s /usr/bin/python3 -u scripts/test-linux-terminal.py "$RUNNER_TEMP/zaslon" "$MODE" "$CODEX_TEST_BIN" "$RUNNER_TEMP/cli/node_modules/.bin/claude")
          if test "$MODE" = cgroup; then
            sudo systemd-run --wait --pipe --collect --unit="zaslon-tty-test-$GITHUB_RUN_ID" --property="User=$(id -un)" --property=Delegate=yes --working-directory="$PWD" --setenv=GITHUB_ACTIONS=true --setenv="RUNNER_TEMP=$RUNNER_TEMP" "${args[@]}"
          else
            "${args[@]}"
          fi
